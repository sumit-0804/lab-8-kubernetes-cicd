# The only Service reachable from outside the cluster.
# Docker Desktop publishes NodePorts on localhost, so the gateway is http://localhost:30080.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    part-of: lab8
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
