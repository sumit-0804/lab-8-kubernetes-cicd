# Internal only (ClusterIP). Other Pods reach it as http://product-service:3002.
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
    part-of: lab8
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3002
      targetPort: http
