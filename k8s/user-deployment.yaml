apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
    part-of: lab8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        part-of: lab8
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      containers:
        - name: user-service
          image: user-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: lab8-config, key: USER_SERVICE_PORT }
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: lab8-mongo, key: USER_MONGO_URI }
          # /health answers 503 until the Atlas connection is up, so the Pod only gets traffic once it can serve it.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          # TCP only: a short Atlas outage should not make Kubernetes restart the container.
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
