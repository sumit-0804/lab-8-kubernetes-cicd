apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    part-of: lab8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        part-of: lab8
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3002"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      containers:
        - name: product-service
          image: product-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: lab8-config, key: PRODUCT_SERVICE_PORT }
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: lab8-mongo, key: PRODUCT_MONGO_URI }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
