# Internal only (ClusterIP). Other Pods reach it as http://user-service:3001.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels:
    app: user-service
    part-of: lab8
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 3001
      targetPort: http
