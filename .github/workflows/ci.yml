name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  # Lets GITHUB_TOKEN push images to GitHub Container Registry; no extra secret needed.
  packages: write

jobs:
  build-test-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Report every service's result even if one fails.
      fail-fast: false
      matrix:
        service: [api-gateway, user-service, product-service, order-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Registry paths must be lowercase. Tag = commit SHA, so every image traces back to one commit.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$IMAGE" .

      # Only a push to main delivers an image; pull requests stop after build/test.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          echo "Pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
